services:
  - type: web
    name: bri-apparell-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bri-apparel-db
          property: connectionString

databases:
  - name: bri-apparel-db
    databaseName: bri_apparel
    user: bri_admin
    plan: free
