<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Sign In | BRI APPARELL</title>
  <link rel="stylesheet" href="/css/staff.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #09090b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #fafafa;
    }
    .admin-login-box {
      width: 100%;
      max-width: 440px;
      background: #121215;
      border: 1px solid #27272a;
      border-radius: var(--radius-sm);
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .admin-logo-head {
      font-family: var(--font-brand);
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .admin-portal-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--admin-gold);
      background: rgba(180, 83, 9, 0.15);
      border: 1px solid rgba(180, 83, 9, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-xs);
      margin: 0 auto 2rem;
      text-transform: uppercase;
    }
    .form-group label {
      color: #a1a1aa;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: block;
    }
    .admin-input {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-xs);
      font-size: 0.875rem;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .admin-input:focus {
      border-color: #ffffff;
    }
    .btn-admin-submit {
      width: 100%;
      background: #ffffff;
      color: #09090b;
      border: none;
      padding: 0.875rem;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--radius-xs);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      transition: background 0.15s;
    }
    .btn-admin-submit:hover {
      background: #e4e4e7;
    }
    .login-error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      border-radius: var(--radius-xs);
      margin-bottom: 1.25rem;
      display: none;
    }
    .demo-credentials {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #27272a;
      font-size: 0.75rem;
      color: #71717a;
      line-height: 1.6;
    }
    .demo-credentials code {
      background: #27272a;
      color: #e4e4e7;
      padding: 0.15rem 0.35rem;
      border-radius: 2px;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <div class="admin-login-box">
    <div style="text-align: center;">
      <h1 class="admin-logo-head">BRI APPARELL</h1>
      <span class="admin-portal-badge">EXECUTIVE ADMINISTRATION CONSOLE</span>
    </div>

    <div class="login-error-msg" id="login-error"></div>

    <form id="admin-login-form">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="admin-email">EXECUTIVE EMAIL</label>
        <input type="email" id="admin-email" class="admin-input" placeholder="admin@briapparell.com" required value="admin@briapparell.com">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="admin-password">ACCESS KEY / PASSWORD</label>
        <input type="password" id="admin-password" class="admin-input" placeholder="••••••••••••" required value="admin123">
      </div>

      <button type="submit" class="btn-admin-submit" id="login-btn">
        <i data-lucide="lock" style="width:16px;height:16px;"></i>
        AUTHENTICATE & ENTER
      </button>
    </form>

    <div class="demo-credentials">
      <div style="font-weight:700; color:#a1a1aa; margin-bottom:0.25rem;">DEVELOPMENT CREDENTIALS:</div>
      <div>Admin: <code>admin@briapparell.com</code> | <code>admin123</code></div>
      <div>Ops Admin: <code>ops.admin@briapparell.com</code> | <code>admin123</code></div>
      <div style="margin-top:0.5rem; display:flex; justify-content:space-between;">
        <a href="../index.html" style="color:#a1a1aa; text-decoration:none;">&larr; Storefront</a>
        <a href="../staff/dashboard.html" style="color:#a1a1aa; text-decoration:none;">Staff Operations &rarr;</a>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = 'AUTHENTICATING...';
      errorDiv.style.display = 'none';

      try {
        const res = await Admin.api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.user.role !== 'admin') {
          throw new Error('Access denied. Administrator privileges required to access this console.');
        }

        Admin.setAuth(res.token, res.user);
        window.location.href = 'index.html';
      } catch (err) {
        errorDiv.textContent = err.message || 'Login failed. Please check credentials.';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="lock" style="width:16px;height:16px;"></i> AUTHENTICATE & ENTER';
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
